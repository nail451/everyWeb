<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Перенаправление...</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            display: inline-block;
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255,255,255,0.1);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loader p {
            margin-top: 20px;
            opacity: 0.6;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div class="loader">
    <div class="spinner"></div>
    <p>Загрузка...</p>
</div>

<script>
    // Получаем последнюю сохраненную страницу
    const lastPage = localStorage.getItem('everyweb_last_page');
    console.log('Redirecting to last page:', lastPage);

    // Если есть сохраненная страница и это не 'main' (или любая другая)
    if (lastPage && lastPage !== 'main') {
        window.location.href = '/page/' + encodeURIComponent(lastPage);
    } else {
        window.location.href = '/page/main';
    }
</script>
</body>
</html>
