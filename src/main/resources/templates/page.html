<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${page.name} + ' - Dashboard'"></title>

    <!-- CSS -->
    <link rel="stylesheet" th:href="@{/css/base.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/grid.css}">
    <link rel="stylesheet" th:href="@{/css/links-modal.css}">
    <link rel="stylesheet" th:href="@{/css/settings.css}">
    <link rel="stylesheet" th:href="@{/css/wallpaper.css}">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
</head>
<body id="mainBody">

<!-- ID страницы -->
<div id="pageContainer" style="display:none;" th:data-page-id="${page.id}"></div>

<!-- TOAST -->
<div id="toast" class="toast"></div>

<!-- ХЕДЕР -->
<div class="header">
        <span class="page-title">
            <span class="icon">🏠</span>
            <span th:text="${page.name}"></span>
        </span>
    <div class="header-actions" style="display:flex; gap:8px; align-items:center;">
        <button onclick="toggleEditMode()" class="edit-mode-btn"
                style="padding:4px 12px; border-radius:6px; background:rgba(33,150,243,0.2); border:1px solid rgba(33,150,243,0.3); color:white; cursor:pointer; font-size:12px;">
            ✏️ Редактировать
        </button>
        <button onclick="window.addWidgetDialog()" class="add-widget-btn"
                style="padding:4px 12px; border-radius:6px; background:rgba(76,175,80,0.2); border:1px solid rgba(76,175,80,0.3); color:white; cursor:pointer; font-size:12px;">
            ➕ Добавить виджет
        </button>
        <!-- Навигация страниц -->
        <div class="page-nav" style="display:flex; gap:4px; align-items:center;">
            <a th:each="p : ${pages}"
               th:href="'/page/' + ${p.name}"
               th:text="${p.name}"
               th:classappend="${p.id == page.id} ? 'active' : ''"
               style="padding:2px 8px; border-radius:4px; text-decoration:none; color:rgba(255,255,255,0.4); font-size:12px;"></a>
            <button class="add-page-btn" onclick="createPage()" style="padding:2px 8px; border-radius:4px; background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.06); color:rgba(255,255,255,0.4); cursor:pointer; font-size:12px;">➕</button>
        </div>
    </div>
</div>

<!-- ОСНОВНОЙ КОНТЕНТ - ГРИД -->
<div class="page-grid" id="pageGrid">
    <!-- Виджеты рендерятся через JavaScript -->
</div>

<!-- КНОПКИ -->
<div class="bottom-controls">
    <button class="control-btn wallpaper-btn" onclick="forceChangeWallpaper()" title="Сменить обои">🎨</button>
    <button class="control-btn settings-btn" onclick="toggleSettings()" title="Настройки">⚙️</button>
</div>

<!-- НАСТРОЙКИ -->
<div class="settings-overlay" id="settingsOverlay">
    <div class="settings-panel">
        <div class="settings-header">
            <h2>⚙️ Настройки <span th:text="${page.name}"></span></h2>
            <button class="settings-close" onclick="toggleSettings()">✕</button>
        </div>

        <!-- Обои -->
        <div class="settings-section wallpaper-section">
            <div class="settings-section-title">🖼️ Обои</div>
            <div class="wallpaper-mode-group">
                <label>
                    <input type="radio" name="wallpaperMode" value="STATIC" onchange="WallpaperModule.updateMode(this.value)">
                    <span>📌 Статичное</span>
                </label>
                <label>
                    <input type="radio" name="wallpaperMode" value="RANDOM" onchange="WallpaperModule.updateMode(this.value)">
                    <span>🎲 Случайное</span>
                </label>
                <label>
                    <input type="radio" name="wallpaperMode" value="SEQUENTIAL" onchange="WallpaperModule.updateMode(this.value)">
                    <span>📋 Последовательное</span>
                </label>
            </div>

            <div class="wallpaper-auto-group">
                <label class="auto-toggle">
                    <input type="checkbox" id="autoChangeCheckbox" onchange="WallpaperModule.updateAutoChange(this.checked)">
                    <span>🔄 Автоматическая смена</span>
                </label>

                <div class="wallpaper-auto-settings" id="autoChangeSettings">
                    <label>
                        <span>⏱️ Интервал (сек):</span>
                        <input type="number" id="changeInterval" value="30" min="5" max="3600" onchange="WallpaperModule.updateInterval(this.value)">
                    </label>
                    <label>
                        <span>Режим смены:</span>
                        <select id="changeMode" onchange="WallpaperModule.updateChangeMode(this.value)">
                            <option value="RANDOM">🎲 Случайно</option>
                            <option value="SEQUENTIAL">📋 Последовательно</option>
                        </select>
                    </label>
                    <button class="wallpaper-force-change-btn" onclick="WallpaperModule.forceChange()">🔄 Сменить сейчас</button>
                </div>
            </div>

            <div class="wallpaper-grid" id="wallpaperPreview"></div>

            <div class="wallpaper-upload-area">
                <label class="upload-label" for="wallpaperInput">
                    <span class="icon">📤</span> Загрузить обои
                </label>
                <input type="file" id="wallpaperInput" accept="image/*" multiple onchange="WallpaperModule.uploadWallpapers(this)">
                <span class="upload-hint">JPG, PNG, GIF, WEBP до 50MB</span>
            </div>
        </div>
    </div>
</div>

<!-- JAVASCRIPT -->
<script th:src="@{/js/core.js}"></script>
<script th:src="@{/js/header.js}"></script>
<script th:src="@{/js/grid.js}"></script>
<script th:src="@{/js/modules.js}"></script>
<script th:src="@{/js/links.js}"></script>
<script th:src="@{/js/links-modal.js}"></script>
<script th:src="@{/js/clock-module.js}"></script>
<script th:src="@{/js/weather-module.js}"></script>
<script th:src="@{/js/nextcloud-module.js}"></script>
<script th:src="@{/js/settings.js}"></script>
<script th:src="@{/js/wallpaper.js}"></script>

<!-- Добавление виджетов -->
<script>
    function addWidgetDialog() {
        const types = [
            {type: 'LINK', name: '🔗 Ссылки'},
            {type: 'CLOCK', name: '🕐 Часы'},
            {type: 'WEATHER', name: '🌤️ Погода'},
            {type: 'NOTE', name: '📝 Заметки'},
            {type: 'TODO', name: '✅ Список дел'},
            {type: 'NEXTCLOUD', name: '☁️ Nextcloud'}
        ];

        let message = 'Выберите тип виджета:\n';
        types.forEach((t, i) => {
            message += `${i+1}. ${t.name}\n`;
        });

        const choice = prompt(message);
        if (!choice) return;

        const index = parseInt(choice) - 1;
        if (index < 0 || index >= types.length) {
            showToast('❌ Неверный выбор');
            return;
        }

        addWidget(types[index].type);
    }
</script>
<script>
    document.addEventListener('DOMContentLoaded', function() {
        // Проверяем, что все модули загружены
        console.log('All scripts loaded. LinksModal:', typeof LinksModal !== 'undefined' ? '✅' : '❌');
        console.log('Grid:', typeof gridState !== 'undefined' ? '✅' : '❌');
        console.log('Modules:', typeof window.loadModuleSettings !== 'undefined' ? '✅' : '❌');
    });
</script>
</body>
</html>
