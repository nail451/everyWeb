spring:
  application:
    name: everyWeb
  datasource:
    url: jdbc:postgresql://localhost:5433/everyWeb
    username: root
    password: secret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: create
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true
    properties:
      hibernate:
        format_sql: false
  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
  web:
    resources:
      static-locations: classpath:/static/
      add-mappings: true
  task:
    scheduling:
      enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      file-size-threshold: 2MB
      location: ./tmp
app:
  wallpaper:
    upload-dir: ./wallpapers
    max-file-size: 52428800    # 50MB
    allowed-extensions: jpg,jpeg,png,gif,bmp,webp